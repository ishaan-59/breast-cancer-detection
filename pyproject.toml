[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breast-cancer-detection"
version = "0.1.0"
description = "Research pipeline for CBIS-DDSM classification, Grad-CAM, and lesion segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numpy",
  "opencv-python",
  "pandas",
  "pydicom",
  "torch",
  "torchvision",
  "tqdm",
]

[project.optional-dependencies]
notebooks = ["jupyter", "kagglehub", "scikit-learn"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
